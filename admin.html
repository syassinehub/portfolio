<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Administration — Wafa Malik</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://vdcpnozdfsmdyiyepnmu.supabase.co wss://vdcpnozdfsmdyiyepnmu.supabase.co; base-uri 'self'; form-action 'self'">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin">

    <!-- Connexion -->
    <main id="login-view" class="login" hidden>
        <form id="login-form" class="login-card">
            <a href="index.html" class="brand"><span class="brand-mark" aria-hidden="true">WM</span><span class="brand-name">Wafa Malik</span></a>
            <h1>Administration</h1>
            <label>
                <span>Email</span>
                <input type="email" name="email" autocomplete="username" required>
            </label>
            <label>
                <span>Mot de passe</span>
                <input type="password" name="password" autocomplete="current-password" required>
            </label>
            <p id="login-error" class="form-error" role="alert"></p>
            <button type="submit" class="btn btn-dark">Se connecter</button>
            <a href="index.html" class="back-link">← Retour au site</a>
        </form>
    </main>

    <!-- Tableau de bord -->
    <div id="dashboard-view" hidden>
        <header class="admin-header">
            <div class="container admin-header-inner">
                <a href="index.html" class="brand" title="Voir le site"><span class="brand-mark" aria-hidden="true">WM</span><span class="brand-name">Admin</span></a>
                <nav id="admin-tabs" class="admin-tabs" role="tablist"></nav>
                <div class="admin-user">
                    <span id="admin-email"></span>
                    <button id="logout-btn" class="btn-small">Déconnexion</button>
                </div>
            </div>
        </header>

        <main class="container admin-main">
            <div class="admin-toolbar">
                <h1 id="section-title"></h1>
                <button id="add-btn" class="btn btn-dark">+ Ajouter</button>
            </div>
            <div id="items" class="admin-items" aria-live="polite"></div>
        </main>
    </div>

    <!-- Formulaire d'ajout / édition -->
    <dialog id="editor" class="editor">
        <form id="editor-form" method="dialog">
            <header>
                <h2 id="editor-title"></h2>
                <button type="button" class="icon-btn" data-close aria-label="Fermer">✕</button>
            </header>
            <div id="editor-fields" class="editor-fields"></div>
            <p id="editor-error" class="form-error" role="alert"></p>
            <footer>
                <button type="button" class="btn-small" data-close>Annuler</button>
                <button type="submit" class="btn btn-dark">Enregistrer</button>
            </footer>
        </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
